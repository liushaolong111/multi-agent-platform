name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check api graph memory rag tests evals config.py main.py

      - name: Smoke tests
        # 测试已完全 mock 外部依赖，无需真实 API Key / Redis / FAISS 索引
        env:
          DEEPSEEK_API_KEY: test-key
          DATABASE_URL: ""
        run: pytest tests/ -v
