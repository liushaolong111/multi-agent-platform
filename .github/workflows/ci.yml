name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # 测试全部 hermetic：节点级 mock，不需要 API Key / Redis / FAISS 索引
      - run: pytest tests/ -v

  # 效果回归门禁：需要真实 LLM，只在配置了 DEEPSEEK_API_KEY secret 时运行。
  # 正确率低于阈值（0.8）时 job 失败，阻止合并——防止"改了 prompt/代码，效果悄悄退化"。
  eval-gate:
    runs-on: ubuntu-latest
    if: ${{ vars.EVAL_GATE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
        # FAISS 索引不在仓库中，先构建（需要联网下载 embedding 模型）
      - run: python app/script/ingest.py
        env:
          HF_ENDPOINT: https://hf-mirror.com
      - run: python evals/run_eval.py --gate 0.8
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_ENDPOINT: https://hf-mirror.com
